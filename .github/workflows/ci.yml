name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'Makefile'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'Makefile'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-service
            port: 8001
          - service: product-service
            port: 8002
          - service: order-service
            port: 8003
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install flake8 black
        working-directory: services/${{ matrix.service }}

      - name: Run black
        run: black --check app/
        working-directory: services/${{ matrix.service }}

      - name: Run flake8
        run: flake8 app/
        working-directory: services/${{ matrix.service }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint helm chart
        run: helm lint helm-chart/

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-service
            port: 8001
          - service: product-service
            port: 8002
          - service: order-service
            port: 8003
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:latest .
        working-directory: services/${{ matrix.service }}

      - name: Test health endpoint
        run: |
          docker run -d -p ${{ matrix.port }}:${{ matrix.port }} \
            -e JWT_SECRET_KEY=test-secret \
            -e DATABASE_URL=sqlite:///test.db \
            --name test-${{ matrix.service }} ${{ matrix.service }}:latest
          sleep 3
          curl --fail http://localhost:${{ matrix.port }}/health
          docker stop test-${{ matrix.service }}
