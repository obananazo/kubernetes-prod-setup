name: Validate manifests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'services/**/k8s/**'
      - 'helm-chart/**'
      - '.github/workflows/validate-manifests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'services/**/k8s/**'
      - 'helm-chart/**'
      - '.github/workflows/validate-manifests.yml'

jobs:
  validate-service-manifests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, order-service]
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate ${{ matrix.service }} manifests
        run: kubeconform -strict services/${{ matrix.service }}/k8s/

  validate-cluster-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate cluster manifests
        run: kubeconform -strict k8s/

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm-chart/
